name: Auditoría de calidad editorial y SEO

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compilar y comprobar el JavaScript
        run: |
          python -m py_compile scripts/*.py
          node --check assets/js/calculator.js
          node --check assets/js/invoice.js
          node --check assets/js/search.js
      - name: Comprobar los cálculos publicados y sus límites
        run: node scripts/test_tools.js
      - name: Generar las páginas
        run: python scripts/build.py
      - name: Revisar lo indexable
        run: python scripts/validate_quality.py
